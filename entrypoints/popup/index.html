<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reverse Image Search</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2.5" y="4" width="17" height="14" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <circle cx="7" cy="8.5" r="1.6" fill="#4f46e5"/>
        <path d="M4 15.5 L8.5 10.5 L11.5 13.5 L14 10.5 L17.5 15.5 Z" fill="#4f46e5" fill-opacity="0.85"/>
        <circle cx="22" cy="21" r="6.5" fill="#ffffff" stroke="#0d9488" stroke-width="2.2"/>
        <line x1="26.8" y1="25.8" x2="29.5" y2="28.5" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <h1>Reverse Image Search</h1>
    </div>
    <p class="hint">Right-click any image → <b>Reverse image search</b>.</p>

    <div class="actions">
      <button id="capture" class="btn">◱ Capture region</button>
      <button id="face" class="btn">🔍 Search this face</button>
      <div id="paste" class="paste" tabindex="0">Paste an image — ⌘/Ctrl + V</div>
    </div>
    <p class="note" id="status" hidden></p>

    <h2>Engines <span class="sub">(toggle to enable)</span></h2>
    <ul id="engines"></ul>

    <label class="row">
      <input type="checkbox" id="openInBackground" />
      Open “All engines” tabs in the background
    </label>

    <p class="footer"><span class="badge">Private</span>Captured / pasted / face images upload privately and search across every enabled engine</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
