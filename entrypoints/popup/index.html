<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reverse Image Search</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Reverse Image Search</h1>
    <p class="hint">Right-click any image → <b>Reverse image search</b>.</p>

    <div class="actions">
      <button id="capture" class="btn">◱ Capture region</button>
      <div id="paste" class="paste" tabindex="0">Paste an image — ⌘/Ctrl + V</div>
    </div>
    <p class="note" id="status" hidden></p>

    <h2>Engines <span class="sub">(toggle to enable)</span></h2>
    <ul id="engines"></ul>

    <label class="row">
      <input type="checkbox" id="openInBackground" />
      Open “All engines” tabs in the background
    </label>

    <p class="footer">Captured / pasted images search via Google Lens for now · more engines coming</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
