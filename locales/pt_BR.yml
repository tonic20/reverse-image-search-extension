# Manifest — Chrome substitutes __MSG_extName__ / __MSG_extDescription__ from
# the generated _locales. Must stay flat top-level keys named exactly like this.
extName: Reverse Image Search Anywhere
extDescription: Busca reversa de imagens no Google Lens, Yandex, Bing e TinEye num clique. Funciona no Instagram e no Pinterest. Busque um rosto.

# Shared (used in more than one entrypoint)
cancel: Cancelar
search_this_face: Buscar este rosto

# Popup
popup_heading: Reverse Image Search Anywhere
popup_hint_html: Clique com o botão direito em qualquer imagem → <b>Reverse Image Search Anywhere</b>.
popup_capture: Capturar área
popup_paste: Cole uma imagem — ⌘/Ctrl + V
popup_engines_title: Mecanismos
popup_engines_sub: (ative para habilitar)
popup_open_background: Abrir as abas de “Todos os mecanismos” em segundo plano
popup_footer: Imagens capturadas / coladas / de rosto são enviadas de forma privada e buscadas em todos os mecanismos habilitados
popup_badge_private: Privado
status_no_clipboard_image: Nenhuma imagem encontrada na área de transferência.
status_reload: Recarregue esta página e tente $1 novamente.

# Engine notes — shown in the popup engine list
engine_note_google: Imagens semelhantes, produtos, geral
engine_note_bing: Geral + bom OCR
engine_note_yandex: Melhor para rostos / pessoas
engine_note_tineye: Correspondências exatas / onde apareceu pela primeira vez

# Background: context menu + reload badge
menu_all_engines: Todos os mecanismos
menu_all_engines_upload: Todos os mecanismos (enviar — Instagram/Pinterest)
menu_face: '🔍 Buscar este rosto…'
menu_capture: Capturar área para buscar
action_reload_title: Recarregue esta página para usar a busca reversa de imagens

# Content: capture / crop hints + toasts
content_toast_no_image_here: Nenhuma imagem encontrada ali — tente “Capturar área”.
content_toast_unreadable: Não foi possível ler esta imagem — tente “Capturar área”.
capture_hint_face: Arraste uma caixa ao redor do rosto · Esc para cancelar
capture_hint_area: Arraste para selecionar uma área · Esc para cancelar
crop_instruction: Arraste uma caixa ao redor do rosto e depois busque.

# Content: face-search ethics gate — HUMAN-REVIEW-GATED copy
ethics_line: Para verificar pessoas, fontes e autenticidade — não para perseguir ou assediar. Siga a lei local.
ethics_pill: Uso responsável
ethics_body1_html: A busca por rosto é poderosa. Use-a para <b>reencontrar fontes, verificar a autenticidade e identificar falsificações ou perfis falsos</b>.
ethics_body2_html: <b>Não</b> a use para perseguir, assediar ou identificar pessoas sem um motivo legítimo. Você é responsável por cumprir as leis locais.
i_understand: Entendi

# Review prompt (popup)
review_prompt_title: Curtindo o Reverse Image Search Anywhere?
review_prompt_body: Seu feedback ajuda mais pessoas a encontrá-lo.
review_prompt_review: Escrever uma avaliação
review_prompt_later: Agora não
review_prompt_feedback: Enviar feedback
